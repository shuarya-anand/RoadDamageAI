name: Build RoadDamageAI (Windows)

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Check application icon
        shell: pwsh
        run: |
          Write-Host "Checking RoadDamageAI.ico..."
          Get-Item "RoadDamageAI.ico"

      - name: Build RoadDamageAI
        run: |
          pyinstaller --clean --onefile --windowed --name RoadDamageAI --icon="RoadDamageAI.ico" app.py

      - name: Prepare Release
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "Release"
          New-Item -ItemType Directory -Force -Path "Release\models"
          New-Item -ItemType Directory -Force -Path "Release\test_images"
          New-Item -ItemType Directory -Force -Path "Release\output"

          Copy-Item "dist\RoadDamageAI.exe" "Release\RoadDamageAI.exe"
          Copy-Item "models\best.pt" "Release\models\best.pt"
          Copy-Item "test_images\*" "Release\test_images\" -Recurse

          @"
          RoadDamageAI
          =================

          AI-powered road damage detection desktop application.

          HOW TO RUN
          ----------
          1. Double-click RoadDamageAI.exe
          2. Click "Open image"
          3. Select a road image
          4. RoadDamageAI will analyze the image automatically
          5. View the detected damage and confidence scores

          No Python installation is required.

          PROJECT
          -------
          RoadDamageAI uses a YOLO-based computer vision model
          trained for road damage detection.

          Supported damage categories include:
          - Longitudinal crack
          - Transverse crack
          - Alligator crack
          - Pothole
          - Crosswalk blur
          - White line blur
          - Utility hole
          "@ | Set-Content "Release\README_RUN.txt"

      - name: Upload Windows Release
        uses: actions/upload-artifact@v4
        with:
          name: RoadDamageAI-Windows
          path: Release
