name: Build RoadDamageAI (Windows)

on:
  push:
    branches:
      - main

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build DEBUG EXE
        run: |
          pyinstaller --onefile --console --name RoadDamageAI app.py

      - name: Prepare Release Folder
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path Release
          Copy-Item dist\RoadDamageAI.exe Release\

          New-Item -ItemType Directory -Force -Path Release\models
          Copy-Item models\best.pt Release\models\

          New-Item -ItemType Directory -Force -Path Release\test_images
          Copy-Item test_images\* Release\test_images\ -Recurse

          Set-Content Release\README_RUN.txt @"
          RoadDamageAI - Windows

          DEBUG BUILD

          Run RoadDamageAI.exe.

          If the application closes immediately, open Command Prompt
          in this folder and run:

          RoadDamageAI.exe
          "@

      - name: Upload Package
        uses: actions/upload-artifact@v4
        with:
          name: RoadDamageAI-Windows-Debug
          path: Release
