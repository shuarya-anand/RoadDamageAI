name: Build RoadDamageAI (Windows)

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build RoadDamageAI
        run: |
          pyinstaller --onedir --windowed --name RoadDamageAI app.py

      - name: Prepare Release
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path Release

          Copy-Item -Path "dist\RoadDamageAI" -Destination "Release\RoadDamageAI" -Recurse

          New-Item -ItemType Directory -Force -Path "Release\RoadDamageAI\models"
          Copy-Item "models\best.pt" "Release\RoadDamageAI\models\best.pt"

          New-Item -ItemType Directory -Force -Path "Release\RoadDamageAI\test_images"
          Copy-Item "test_images\*" "Release\RoadDamageAI\test_images\" -Recurse

          @"
          RoadDamageAI - Windows

          How to run:
          1. Open the RoadDamageAI folder.
          2. Double-click RoadDamageAI.exe.
          3. Click "Open image".
          4. Select a road image.
          5. RoadDamageAI will analyze it automatically.

          No Python installation is required.
          "@ | Set-Content "Release\README_RUN.txt"

      - name: Upload Windows Build
        uses: actions/upload-artifact@v4
        with:
          name: RoadDamageAI-Windows-Fast
          path: Release
