name: Build RoadDamageAI (Windows)

on:
  push:
    branches:
      - main

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build EXE
        run: |
          pyinstaller --onefile --windowed --name RoadDamageAI app.py

      - name: Prepare Release Folder
        shell: pwsh
        run: |
          mkdir Release
          copy dist\RoadDamageAI.exe Release\
          mkdir Release\models
          copy models\best.pt Release\models\
          mkdir Release\test_images
          xcopy test_images Release\test_images /E /I
          copy LICENSE Release\
          echo "Double-click RoadDamageAI.exe to run the application." > Release\README_RUN.txt

      - name: Upload Package
        uses: actions/upload-artifact@v4
        with:
          name: RoadDamageAI-Windows
          path: Release