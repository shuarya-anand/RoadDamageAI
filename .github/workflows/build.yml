name: Build RoadDamageAI (Windows)

on:
  push:
    branches:
      - main

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build EXE
        shell: cmd
        run: |
          pyinstaller ^
          --noconfirm ^
          --clean ^
          --onefile ^
          --windowed ^
          --name RoadDamageAI ^
          --collect-all ultralytics ^
          --collect-all customtkinter ^
          --collect-all PIL ^
          --collect-all torch ^
          --collect-all torchvision ^
          --hidden-import=cv2 ^
          --hidden-import=numpy ^
          app.py

      - name: Prepare Release Folder
        shell: cmd
        run: |
          mkdir Release
          copy dist\RoadDamageAI.exe Release\

          mkdir Release\models
          copy models\best.pt Release\models\

          mkdir Release\test_images
          xcopy test_images Release\test_images /E /I /Y

